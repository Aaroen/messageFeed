name: messagefeed

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # docker tag 不允许大写；GHCR 命名空间大小写不敏感，统一用小写 owner。
  IMAGE_REGISTRY: ghcr.io/aaroen
  IMAGE_TAG: ${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test ./...
      - run: go vet ./...
      # 官方 v1.64.8 二进制是 go1.24 构建的，拒绝分析 go1.26 模块；用仓库工具链源码安装同版本。
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      # 层 1 门禁：只开 unused + staticcheck；--no-config 避免 .golangci.yml 全量 linter 穿透。
      - run: golangci-lint run --no-config --disable-all -E unused -E staticcheck ./...
      - run: go build ./cmd/api ./cmd/notification
      - run: npm ci --prefix web
      - run: npm run type-check --prefix web
      - run: npm run build --prefix web
      - run: helm lint deploy/helm/messagefeed -f deploy/helm/messagefeed/values-k3s.yaml
      - run: helm template messagefeed deploy/helm/messagefeed --namespace messagefeed -f deploy/helm/messagefeed/values-k3s.yaml >/dev/null

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/messagefeed-api:${{ env.IMAGE_TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: notification
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/messagefeed-notification:${{ env.IMAGE_TAG }}

  deploy-staging:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, publish]
    # pi-lens-ignore: runner-label
    runs-on: [self-hosted, messagefeed-staging]
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Upsert GHCR pull secret
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl -n messagefeed-staging create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
      # staging 范围：不用生产 Tunnel（避免双连接器分流）、不跑观测栈、单副本减负载。
      - run: |
          helm upgrade --install messagefeed-staging deploy/helm/messagefeed \
            --namespace messagefeed-staging --create-namespace \
            -f deploy/helm/messagefeed/values-k3s.yaml \
            --set cloudflared.enabled=false \
            --set observability.enabled=false \
            # StorageClass 是集群级资源，归生产 release 所有，staging 不接管。
            --set storageClass.create=false \
            --set api.replicaCount=1 \
            --set web.replicaCount=1 \
            --set gateway.replicaCount=1 \
            --set api.image.repository="$IMAGE_REGISTRY/messagefeed-api" \
            --set api.image.tag="$IMAGE_TAG" \
            --set workers.notification.image.repository="$IMAGE_REGISTRY/messagefeed-notification" \
            --set workers.notification.image.tag="$IMAGE_TAG" \
            --set imagePullSecrets[0].name=ghcr-pull \
            --atomic --wait --wait-for-jobs --timeout 10m
      - run: |
          kubectl -n messagefeed-staging rollout status deployment/messagefeed-api --timeout=240s
          kubectl -n messagefeed-staging rollout status deployment/notification-worker --timeout=240s
          kubectl -n messagefeed-staging get pods
