name: messagefeed

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # docker tag 不允许大写；GHCR 命名空间大小写不敏感，统一用小写 owner。
  IMAGE_REGISTRY: ghcr.io/aaroen
  IMAGE_TAG: ${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test ./...
      - run: go vet ./...
      # 官方 v1.64.8 二进制是 go1.24 构建的，拒绝分析 go1.26 模块；用仓库工具链源码安装同版本。
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      # 层 1 门禁：只开 unused + staticcheck；--no-config 避免 .golangci.yml 全量 linter 穿透。
      - run: golangci-lint run --no-config --disable-all -E unused -E staticcheck ./...
      - run: go build ./cmd/api ./cmd/notification
      - run: npm ci --prefix web
      - run: npm run type-check --prefix web
      - run: npm run build --prefix web
      - run: helm lint deploy/helm/messagefeed -f deploy/helm/messagefeed/values-k3s.yaml
      - run: helm template messagefeed deploy/helm/messagefeed --namespace messagefeed -f deploy/helm/messagefeed/values-k3s.yaml >/dev/null

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/messagefeed-api:${{ env.IMAGE_TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: notification
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/messagefeed-notification:${{ env.IMAGE_TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/messagefeed-web:${{ env.IMAGE_TAG }}

  deploy-staging:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [validate, publish]
    # pi-lens-ignore: runner-label
    runs-on: [self-hosted, messagefeed-staging]
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Upsert GHCR pull secret
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl -n messagefeed-staging create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
      # 首次安装引导：pre-install migrate hook 先于常规资源执行，全新 namespace 里 postgres 尚不存在，
      # hook 会死等超时。首次只装 postgres（应用缩零、关迁移），后续 upgrade 再跑完整命令。
      - name: Bootstrap staging PostgreSQL (first install only)
        run: |
          if helm status messagefeed-staging -n messagefeed-staging >/dev/null 2>&1; then
            echo "release exists, skip bootstrap"
            exit 0
          fi
          helm upgrade --install messagefeed-staging deploy/helm/messagefeed \
            --namespace messagefeed-staging --create-namespace \
            -f deploy/helm/messagefeed/values-k3s.yaml \
            --set migrations.enabled=false \
            --set cloudflared.enabled=false \
            --set observability.enabled=false \
            --set storageClass.create=false \
            --set workers.source.enabled=false \
            --set workers.notification.enabled=false \
            --set workers.agentScheduler.enabled=false \
            --set workers.embedding.enabled=false \
            --set workers.itemEvent.enabled=false \
            --set workers.agent.enabled=false \
            --set api.image.repository="$IMAGE_REGISTRY/messagefeed-api" \
            --set api.image.tag="$IMAGE_TAG" \
            --set imagePullSecrets[0].name=ghcr-pull \
            --atomic --wait --timeout 5m
      # staging 范围：不用生产 Tunnel（避免双连接器分流）、不跑观测栈、单副本减负载；
      # StorageClass 是集群级资源，归生产 release 所有，staging 不接管。
      - run: |
          helm upgrade --install messagefeed-staging deploy/helm/messagefeed \
            --namespace messagefeed-staging --create-namespace \
            -f deploy/helm/messagefeed/values-k3s.yaml \
            --set migrations.enabled=true \
            --set cloudflared.enabled=false \
            --set observability.enabled=false \
            --set storageClass.create=false \
            --set api.replicaCount=1 \
            --set web.replicaCount=1 \
            --set gateway.replicaCount=1 \
            --set workers.source.enabled=true \
            --set workers.agentScheduler.enabled=true \
            --set workers.embedding.enabled=true \
            --set workers.itemEvent.enabled=true \
            --set workers.agent.enabled=true \
            --set api.image.repository="$IMAGE_REGISTRY/messagefeed-api" \
            --set api.image.tag="$IMAGE_TAG" \
            --set workers.notification.image.repository="$IMAGE_REGISTRY/messagefeed-notification" \
            --set workers.notification.image.tag="$IMAGE_TAG" \
            --set web.image.repository="$IMAGE_REGISTRY/messagefeed-web" \
            --set web.image.tag="$IMAGE_TAG" \
            --set imagePullSecrets[0].name=ghcr-pull \
            --atomic --wait --wait-for-jobs --timeout 10m
      # 冒烟失败即回滚到上一 revision（--atomic 只覆盖升级过程本身的失败）。
      - name: Smoke check (rollback on failure)
        run: |
          if ! kubectl -n messagefeed-staging rollout status deployment/messagefeed-api --timeout=240s; then
            echo "::error::api rollout failed, rolling back"
            helm rollback messagefeed-staging --wait --wait-for-jobs --timeout 10m
            exit 1
          fi
          if ! kubectl -n messagefeed-staging exec deploy/messagefeed-api -- wget -qO- -T 10 http://localhost:60001/readyz; then
            echo "::error::readyz smoke check failed, rolling back"
            helm rollback messagefeed-staging --wait --wait-for-jobs --timeout 10m
            exit 1
          fi
      - run: kubectl -n messagefeed-staging get pods

  deploy-production:
    # 生产发布保持手动触发（workflow_dispatch）：同一次运行内先过 staging，再提升到生产。
    # 如需人工审批门，在仓库 Settings -> Environments -> production 配置 required reviewers。
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, publish, deploy-staging]
    # pi-lens-ignore: runner-label
    runs-on: [self-hosted, messagefeed-staging]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Upsert GHCR pull secret
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl -n messagefeed create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
      # 生产发布：保留 values-k3s 生产值（双副本、Tunnel、观测栈、迁移），仅将镜像切换为 CI 不可变产物。
      - run: |
          helm upgrade --install messagefeed deploy/helm/messagefeed \
            --namespace messagefeed \
            -f deploy/helm/messagefeed/values-k3s.yaml \
            --set api.image.repository="$IMAGE_REGISTRY/messagefeed-api" \
            --set api.image.tag="$IMAGE_TAG" \
            --set workers.notification.image.repository="$IMAGE_REGISTRY/messagefeed-notification" \
            --set workers.notification.image.tag="$IMAGE_TAG" \
            --set web.image.repository="$IMAGE_REGISTRY/messagefeed-web" \
            --set web.image.tag="$IMAGE_TAG" \
            --set imagePullSecrets[0].name=ghcr-pull \
            --atomic --wait --wait-for-jobs --timeout 10m
      - name: Smoke check (rollback on failure)
        run: |
          if ! kubectl -n messagefeed rollout status deployment/messagefeed-api --timeout=240s; then
            echo "::error::api rollout failed, rolling back"
            helm rollback messagefeed --wait --wait-for-jobs --timeout 10m
            exit 1
          fi
          if ! kubectl -n messagefeed exec deploy/messagefeed-api -- wget -qO- -T 10 http://localhost:60001/readyz; then
            echo "::error::readyz smoke check failed, rolling back"
            helm rollback messagefeed --wait --wait-for-jobs --timeout 10m
            exit 1
          fi
      - run: kubectl -n messagefeed get pods
