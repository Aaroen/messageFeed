apiVersion: batch/v1
kind: CronJob
metadata:
  name: messagefeed-guest-history-cleanup
  labels:
    {{- include "messagefeed.labels" . | nindent 4 }}
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: messagefeed
            messagefeed.io/app-role: agent-worker
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: cleanup
              image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
              imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
              command: ["psql"]
              args: ["--dbname=$(DATABASE_URL)", "--set=ON_ERROR_STOP=1", "--command=DELETE FROM agent_guest_model_requests WHERE created_at <= NOW() - INTERVAL '7 days'"]
              env:
                - name: DATABASE_URL
                  {{- if .Values.appSecret.existingSecret }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "messagefeed.appSecretName" . }}
                      key: DATABASE_URL
                  {{- else }}
                  value: {{ include "messagefeed.databaseURL" . | quote }}
                  {{- end }}
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
